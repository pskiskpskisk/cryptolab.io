<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography and Network Sedcurity Lab Exercise Index</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 12px;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .card:nth-child(2n) .card-header {
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
        }
        
        .card:nth-child(3n) .card-header {
            background: linear-gradient(to right, #fa709a 0%, #fee140 100%);
        }
        
        .card:nth-child(4n) .card-header {
            background: linear-gradient(to right, #a8edea 0%, #fed6e3 100%);
        }
        
        .card:nth-child(5n) .card-header {
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
        }
        
        .ex-number {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .ex-name {
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .card-content p {
            color: #666;
            margin-bottom: 15px;
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        
        .tag {
            background-color: #eef2ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #4f6df5;
        }
        
        .card-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            background-color: #4f6df5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3a56e4;
        }
        
        .instructions {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .instructions h2 {
            color: #4f6df5;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions h2 i {
            font-size: 1.8rem;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }
        
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cryptography and Network Sedcurity Lab <br> Exercise Index</h1>
        </header>
        
        <div class="cards-container" id="cardsContainer">
            <!-- Cards will be generated by JavaScript -->
        </div>
        
        <footer>
            <p>Exercise Index &copy; 2023 | Designed for easy navigation and learning</p>
        </footer>
    </div>

    <script>
        // Exercise data with the requested format
        const exercises = [
            {
                id: 1,
                number: "Ex1",
                name: "Classical Ciphers",
                description: "Playfair, Affine, Vigenere Ciphers",
                tags: [],
                icon: "fa-code"
				
            },
            {
                id: 2,
                number: "Ex2",
                name: "Fibonacci Sequence",
                description: "Write a function to generate the first n numbers in the Fibonacci sequence.",
                tags: ["Algorithms", "Math", "Recursion"],
                icon: "fa-calculator"
            },
            {
                id: 3,
                number: "Ex3",
                name: "Palindrome Checker",
                description: "Create a function that checks whether a given string is a palindrome.",
                tags: ["Strings", "Logic", "Validation"],
                icon: "fa-check-double"
            },
            {
                id: 4,
                number: "Ex4",
                name: "To-Do List Application",
                description: "Build a simple to-do list app with add, edit, and delete functionality.",
                tags: ["Web Development", "DOM", "Local Storage"],
                icon: "fa-tasks"
            },
            {
                id: 5,
                number: "Ex5",
                name: "Data Visualization",
                description: "Use a charting library to visualize dataset trends and patterns.",
                tags: ["Charts", "Data", "Visualization"],
                icon: "fa-chart-bar"
            },
            {
                id: 6,
                number: "Ex6",
                name: "API Integration",
                description: "Connect to a public API and display the retrieved data in a user-friendly format.",
                tags: ["API", "Async", "Fetch"],
                icon: "fa-cloud"
            },
            {
                id: 7,
                number: "Ex7",
                name: "Authentication System",
                description: "Implement a secure login and registration system with password encryption.",
                tags: ["Security", "Authentication", "Backend"],
                icon: "fa-user-lock"
            }
        ];
        
        // Generate cards dynamically
        const cardsContainer = document.getElementById('cardsContainer');
        
        exercises.forEach(exercise => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas ${exercise.icon}"></i>
                    </div>
                    <div class="ex-number">${exercise.number}</div>
                    <div class="ex-name">${exercise.name}</div>
                </div>
                <div class="card-content">
                    <p>${exercise.description}</p>
                    <div class="tags">
                        ${exercise.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="card-footer">
                    <span>Exercise ID: ${exercise.id}</span>
                    <button class="btn" onclick="viewExercise(${exercise.id})">View Exercise</button>
                </div>
            `;
            
            // Add click event to the entire card
            card.addEventListener('click', (e) => {
                // Don't trigger if button was clicked
                if (!e.target.classList.contains('btn')) {
                    viewExercise(exercise.id);
                }
            });
            
            cardsContainer.appendChild(card);
        });
        
        // Function to handle viewing an exercise
        function viewExercise(id) {
            const exercise = exercises.find(ex => ex.id === id);
            if (exercise) {
                //alert(`Loading ${exercise.number}: ${exercise.name}\n\n${exercise.description}\n\nTags: ${exercise.tags.join(', ')}`);
                // In a real application, you would navigate to the exercise page
                 window.location.href = `ex${1}/exercise${id}.html`;
            }
        }
    </script>
</body>
</html>
