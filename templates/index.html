<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography and Network Sedcurity Lab Exercise Index</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }

        body.theme-1 {
            --hero: linear-gradient(135deg, #1d4ed8 0%, #06b6d4 100%);
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --tag-bg: #dbeafe;
            --tag-fg: #1d4ed8;
        }

        body.theme-2 {
            --hero: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
            --accent: #0f766e;
            --accent-dark: #115e59;
            --tag-bg: #ccfbf1;
            --tag-fg: #115e59;
        }

        body.theme-3 {
            --hero: linear-gradient(135deg, #92400e 0%, #f59e0b 100%);
            --accent: #b45309;
            --accent-dark: #92400e;
            --tag-bg: #ffedd5;
            --tag-fg: #9a3412;
        }

        body.theme-4 {
            --hero: linear-gradient(135deg, #6d28d9 0%, #ec4899 100%);
            --accent: #7c3aed;
            --accent-dark: #6d28d9;
            --tag-bg: #f3e8ff;
            --tag-fg: #6d28d9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--hero, linear-gradient(135deg, #6a11cb 0%, #2575fc 100%));
            border-radius: 12px;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .card:nth-child(2n) .card-header {
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
        }
        
        .card:nth-child(3n) .card-header {
            background: linear-gradient(to right, #fa709a 0%, #fee140 100%);
        }
        
        .card:nth-child(4n) .card-header {
            background: linear-gradient(to right, #a8edea 0%, #fed6e3 100%);
        }
        
        .card:nth-child(5n) .card-header {
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
        }
        
        .ex-number {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .ex-name {
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .card-content p {
            color: #666;
            margin-bottom: 15px;
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        
        .tag {
            background-color: var(--tag-bg, #eef2ff);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--tag-fg, #4f6df5);
        }
        
        .card-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            background-color: var(--accent, #4f6df5);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: var(--accent-dark, #3a56e4);
        }
        
        .btn-disabled {
            background-color: #ccc;
            color: #666;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: not-allowed;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        .btn-disabled:hover {
            background-color: #ccc;
        }
        
        .instructions {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .instructions h2 {
            color: #4f6df5;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions h2 i {
            font-size: 1.8rem;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }
        
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
        }
        
        .nav-tabs a {
            padding: 12px 20px;
            text-decoration: none;
            color: #666;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .nav-tabs a:hover {
            color: var(--accent, #4f6df5);
            border-bottom-color: var(--accent, #4f6df5);
        }
        
        .nav-tabs a.active {
            color: var(--accent, #4f6df5);
            border-bottom-color: var(--accent, #4f6df5);
        }
        
        @media (max-width: 480px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 15px;
            }
            
            .nav-tabs {
                gap: 6px;
            }
            
            .nav-tabs a {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cryptography and Network Sedcurity Lab <br> Exercise Index</h1>
        </header>
        
        <div class="nav-tabs">
            <a href="#" class="nav-link active" data-exercise="1">Exercise 1 - Classical Ciphers</a>
            <a href="#" class="nav-link" data-exercise="2">Exercise 2 - Modern Encryption</a>
            <a href="#" class="nav-link" data-exercise="3">Exercise 3 - Key Exchange & RSA</a>
            <a href="#" class="nav-link" data-exercise="4">Exercise 4 - Hashing</a>
        </div>
        
        <div class="cards-container" id="cardsContainer">
            <!-- Cards will be generated by JavaScript -->
        </div>
        
        <footer>
            <p>Exercise Index &copy; 2023 | Designed for easy navigation and learning</p>
        </footer>
    </div>

    <script>
        // Exercise data grouped by exercise number and topics
        const allExercises = {
            1: [
                {
                    id: 1,
                    number: "Ex1-A",
                    name: "Classical Ciphers",
                    description: "Project details",
                    tags: ["Playfair", "Affine", "Vigenere Ciphers"],
                    icon: "fa-code",
                    url: "{{ url_for('ex1.vigenere_route') }}"
                },
                {
                    id: 2,
                    number: "Ex1-B",
                    name: "Number Theory",
                    description: "Project details",
                    tags: ["Euclidean Algorithm", "Fermat's Little Theorem"],
                    icon: "fa-calculator",
                    url: "{{ url_for('ex1.extended_euclidean_route') }}"
                }
            ],
            2: [
                {
                    id: 3,
                    number: "Ex2-A",
                    name: "AES Encryption",
                    description: "Project details",
                    tags: ["AES", "Symmetric"],
                    icon: "fa-lock",
                    url: "{{ url_for('ex2.aes_route') }}"
                },
                {
                    id: 4,
                    number: "Ex2-B",
                    name: "DES Encryption",
                    description: "Project details",
                    tags: ["DES", "Symmetric"],
                    icon: "fa-lock",
                    url: "{{ url_for('ex2.des_route') }}"
                }
            ],
            3: [
                {
                    id: 5,
                    number: "Ex3-A",
                    name: "RSA",
                    description: "Project details",
                    tags: ["RSA", "Asymmetric"],
                    icon: "fa-key",
                    url: "{{ url_for('ex3.rsa_route') }}"
                },
                {
                    id: 6,
                    number: "Ex3-B",
                    name: "Diffie-Hellman",
                    description: "Project details",
                    tags: ["DH", "Key Exchange"],
                    icon: "fa-exchange-alt",
                    url: "{{ url_for('ex3.dh_route') }}"
                }
            ],
            4: [
                {
                    id: 7,
                    number: "Ex4-A",
                    name: "MD5 Hashing",
                    description: "Project details",
                    tags: ["MD5", "Hash"],
                    icon: "fa-fingerprint",
                    url: "{{ url_for('ex4.md5_route') }}"
                },
                {
                    id: 8,
                    number: "Ex4-B",
                    name: "DES-CBC MAC",
                    description: "Project details",
                    tags: ["CMAC", "DES", "MAC"],
                    icon: "fa-shield-halved",
                    url: "{{ url_for('ex4.cmac_route') }}"
                }
            ]
        };
        
        // Add Coming Soon exercises
        for (let i = 5; i <= 7; i++) {
            allExercises[i] = [{
                id: 7 + i,
                number: `Ex${i}`,
                name: "Coming Soon",
                description: "Project details will be updated soon.",
                tags: ["Coming Soon"],
                icon: "fa-clock"
            }];
        }

        let currentExercise = 1;
        const cardsContainer = document.getElementById('cardsContainer');
        
        function renderCards(exerciseNum) {
            document.body.classList.remove('theme-1', 'theme-2', 'theme-3', 'theme-4');
            document.body.classList.add(`theme-${exerciseNum}`);
            cardsContainer.innerHTML = '';
            const exercises = allExercises[exerciseNum] || [];
            
            exercises.forEach(exercise => {
                const card = document.createElement('div');
                card.className = 'card';
                const isComingSoon = exercise.name === "Coming Soon";
                const buttonClass = isComingSoon ? 'btn-disabled' : 'btn';
                const buttonOnClick = isComingSoon ? '' : `onclick="goToExercise('${exercise.url}')"`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas ${exercise.icon}"></i>
                        </div>
                        <div class="ex-number">${exercise.number}</div>
                        <div class="ex-name">${exercise.name}</div>
                    </div>
                    <div class="card-content">
                        <p>${exercise.description}</p>
                        <div class="tags">
                            ${exercise.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="card-footer">
                        <span>Exercise ID: ${exercise.id}</span>
                        <button class="${buttonClass}" ${buttonOnClick}>${isComingSoon ? 'Coming Soon' : 'View Exercise'}</button>
                    </div>
                `;
                
                if (!isComingSoon) {
                    card.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('btn')) {
                            goToExercise(exercise.url);
                        }
                    });
                }
                
                cardsContainer.appendChild(card);
            });
        }
        
        function goToExercise(url) {
            window.location.href = url;
        }
        
        // Tab navigation
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const exerciseNum = parseInt(link.getAttribute('data-exercise'));
                currentExercise = exerciseNum;
                
                // Update active tab
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                
                // Render cards for selected exercise
                renderCards(exerciseNum);
            });
        });
        
        // Initial render
        renderCards(1);
    </script>
</body>
</html>
